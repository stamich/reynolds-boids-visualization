image: sbtscala/scala-sbt:amazoncorretto-al2023-17.0.13_1.10.7_3.6.2

variables:
  SBT_OPTS: "-Dsbt.global.base=sbt-cache/.sbtboot -Dsbt.boot.directory=sbt-cache/.boot -Dsbt.ivy.home=sbt-cache/.ivy"
  _JAVA_OPTIONS: "-Djava.awt.headless=true"

cache:
  paths:
    - sbt-cache/.ivy/cache
    - sbt-cache/.boot
    - sbt-cache/.sbtboot
    - target/

stages:
  - compile
  - test
  - package

before_script:
  # Install dependencies for ScalaFX in headless environment
  - apt-get update -y && apt-get install -y xvfb libxtst6 libxrender1

compile:
  stage: compile
  script:
    - sbt compile
  artifacts:
    paths:
      - target/

test:
  stage: test
  script:
    # Run tests with virtual display for ScalaFX
    - xvfb-run sbt test
  dependencies:
    - compile

package:
  stage: package
  script:
    - sbt package
  dependencies:
    - test
  artifacts:
    paths:
      - target/scala-*/*.jar
  only:
    - main