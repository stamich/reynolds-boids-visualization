name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper bootstrap
        run: ./gradlew --version

      - name: Check formatting and tests
        run: ./gradlew --no-daemon clean check

      - name: Compile JMH benchmark sources
        run: ./gradlew --no-daemon --no-configuration-cache jmhClasses

      - name: Headless uniform-grid smoke test
        run: ./gradlew --no-daemon runHeadless

      - name: Build distribution
        run: ./gradlew --no-daemon assembleDist
